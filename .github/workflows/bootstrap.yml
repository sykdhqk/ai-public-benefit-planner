name: Bootstrap source

on:
  push:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ hashFiles('source.tar.xz') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source tree
        run: tar -xJf source.tar.xz
      - name: Remove bootstrap payload
        run: python3 -c "from pathlib import Path; Path('source.tar.xz').unlink(); Path('.github/workflows/bootstrap.yml').unlink()"
      - name: Commit source tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Publish AI Public Benefit Planner source"
          git push
